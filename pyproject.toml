[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderay"
version = "0.1.0"
description = "Crawls a repo, picks the files that matter, and writes a multi-chapter tutorial."
requires-python = ">=3.10"
dependencies = [
    "pocketflow>=0.0.3,<0.1",
    "pyyaml>=6.0.3,<7",
    "pathspec>=1.1.1,<2",
    "markdown-it-py>=4.2.0,<5",
    "anthropic>=1.0.0,<2",
]

[project.optional-dependencies]
openai = ["openai>=3.3.1,<4"]
gemini = ["google-genai>=0.3.0,<1"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[project.scripts]
coderay = "workflow.__main__:main"

[tool.setuptools]
packages = ["workflow", "coderay_utils"]

[tool.setuptools.package-data]
workflow = ["prompts/*.md", "instructions/*.md"]
