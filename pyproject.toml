[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl"
version = "0.1.0"
description = "Crawls a repo, picks the files that matter, and writes a multi-chapter tour."
requires-python = ">=3.10"
dependencies = [
    "pocketflow>=0.0.3,<0.1",
    "pyyaml>=6.0.3,<7",
    "pathspec>=1.1.1,<2",
    "markdown-it-py>=4.2.0,<5",
    "anthropic>=1.3.0,<2",
    "tree-sitter>=0.25,<0.26",  # the shared capture_texts scaffold imports QueryCursor, added in core 0.25
    "tree-sitter-python>=0.23,<0.25",
    "tree-sitter-javascript>=0.23,<0.25",
    "tree-sitter-typescript>=0.23,<0.25",
    # go 0.25.0 needs language ABI 15, which core 0.25 loads; the other grammars stay at 0.23.x.
    "tree-sitter-go>=0.23,<0.26",
]

[project.optional-dependencies]
openai = ["openai>=3.3.1,<4"]
gemini = ["google-genai>=2.19.0,<3"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "packaging>=24"]  # packaging: tests parse the dependency ranges

[project.scripts]
crawl = "crawl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "crawl", "crawl.core", "crawl.analyses", "crawl.analyses.architecture",
    "crawl.analyses.backend", "crawl.analyses.git_history",
    "crawl.analyses.product_intent",
    "crawl.analyses.interfaces", "crawl.analyses.schema",
    "crawl.analyses.tour",
    "crawl.analyses.tour.graph", "crawl.analyses.tour.graph.languages",
]

[tool.setuptools.package-data]
"crawl.core" = ["prompts/*.md"]
"crawl.analyses.tour" = ["prompts/*.md", "instructions/*.md"]
"crawl.analyses.backend" = ["prompts/*.md"]
"crawl.analyses.architecture" = ["prompts/*.md"]
"crawl.analyses.interfaces" = ["prompts/*.md"]
"crawl.analyses.schema" = ["prompts/*.md"]
"crawl.analyses.git_history" = ["prompts/*.md"]
"crawl.analyses.product_intent" = ["prompts/*.md"]
