[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crack"
version = "0.1.0"
description = "Crawls a repo, picks the files that matter, and writes a multi-chapter tour."
requires-python = ">=3.10"
dependencies = [
    "pocketflow>=0.0.3,<0.1",
    "pyyaml>=6.0.3,<7",
    "pathspec>=1.1.1,<2",
    "markdown-it-py>=4.2.0,<5",
    "anthropic>=1.0.0,<2",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.25",
    "tree-sitter-javascript>=0.23,<0.25",
    "tree-sitter-typescript>=0.23,<0.25",
]

[project.optional-dependencies]
openai = ["openai>=3.3.1,<4"]
gemini = ["google-genai>=2.19.0,<3"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[project.scripts]
crack = "crack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "crack", "crack.core", "crack.analyses", "crack.analyses.backend", "crack.analyses.tour",
    "crack.analyses.tour.graph", "crack.analyses.tour.graph.languages",
]

[tool.setuptools.package-data]
"crack.analyses.tour" = ["prompts/*.md", "instructions/*.md"]
